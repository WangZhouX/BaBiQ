spring:
  application:
    name: BaBiQ-Server
  ai:
    model:
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
      rerank: none
      video: none
    dashscope:
      enabled: false
      chat:
        enabled: false
    openai:
      chat:
        enabled: false

server:
  port: 8080

logging:
  level:
    com.wzx.babiq.server: DEBUG

babiq:
  active-provider: dashscope-default
  providers:
    - id: dashscope-default
      name: "通义千问 (DashScope)"
      type: DASHSCOPE
      api-key: ${AI_DASHSCOPE_API_KEY:}
      model: qwen-plus
    - id: deepseek-official
      name: "DeepSeek (官方)"
      type: OPENAI_COMPATIBLE
      base-url: https://api.deepseek.com
      api-key: ${DEEPSEEK_API_KEY:}
      model: deepseek-v4-pro
    - id: oneapi-relay
      name: "我的中转 (OneAPI)"
      type: OPENAI_COMPATIBLE
      base-url: ${ONEAPI_BASE_URL:https://my-relay.example.com/v1}
      api-key: ${ONEAPI_KEY:}
      model: ${ONEAPI_MODEL:gpt-4o}
    - id: ollama-local
      name: "本地 Llama3"
      type: OPENAI_COMPATIBLE
      base-url: http://localhost:11434/v1
      api-key: ollama
      model: llama3:8b
  memory:
    short-term:
      max-messages: 20
    long-term:
      enabled: true
      generate-enabled: true
      read-enabled: true
      root-dir: ${user.home}/.babiq/memories
      phase1-scan-interval-millis: 3600000
      phase1-min-idle-millis: 300000
      phase1-max-threads-per-scan: 4
      phase1-on-startup: true
      phase1-input-window-percent: 70
      phase1-fallback-token-limit: 150000
      phase2-trigger-on-candidate-count: 5
      phase2-scan-interval-millis: 86400000
      phase2-min-interval-millis: 3600000
      phase2-max-candidates: 256
      read-budget-tokens: 2500
  ws:
    path: /ws/agent
    allowed-origins: "*"
  protocol:
    mock-agent-text: "hello from babiq"
